services:
  - type: web
    name: cravixo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://cravixo.onrender.com
      - key: DATABASE_URL
        value: file:/opt/render/data/cravixo.db
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "3000"